<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Новый расход</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --head: var(--tg-theme-section-header-text-color, var(--hint));
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --line: rgba(127,127,127,.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 12px 12px 96px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 6px 4px 14px; }
  .section { margin: 0 0 16px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--head); margin: 0 6px 6px; }
  .card { background: var(--card); border-radius: 14px; padding: 4px 14px; }
  .field { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 4px; }
  input, textarea { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; padding: 2px 0; }
  input::placeholder, textarea::placeholder { color: var(--hint); opacity: .6; }
  textarea { resize: none; min-height: 72px; }
  input[type="date"] { min-height: 28px; -webkit-appearance: none; appearance: none; }
  .amount-row { display: flex; align-items: center; gap: 12px; }
  .amount-row input { font-size: 22px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 2px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 15px; cursor: pointer; }
  .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .field.err label { color: var(--danger); }
  .field.err .chips .chip { border-color: var(--danger); }
  #fallbackBtn { display: none; position: fixed; left: 12px; right: 12px; bottom: 16px;
    border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); }
  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; padding: 10px 14px; border-radius: 10px;
    font-size: 14px; display: none; max-width: 90%; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>💸 Новый расход</h1>

  <div class="section">
    <div class="section-title">Раздел</div>
    <div class="card">
      <div class="field" data-f="category">
        <div class="chips" id="cats"></div>
      </div>
      <div class="field" data-f="sub" id="subField" style="display:none">
        <label id="subLabel">Подраздел</label>
        <div class="chips" id="subs"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <div class="field" data-f="date">
        <label for="date">Дата расхода</label>
        <input id="date" type="date">
      </div>
      <div class="field" data-f="amount">
        <label for="amount">Сумма</label>
        <div class="amount-row">
          <input id="amount" maxlength="20" inputmode="decimal" autocomplete="off" placeholder="0">
          <div class="chips" data-group="currency" style="flex-wrap:nowrap">
            <button type="button" class="chip on" data-v="$">$</button>
            <button type="button" class="chip" data-v="₾">₾</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <div class="field" data-f="what">
        <label for="what">Детали <span style="font-size:12px;opacity:.8" id="whatOpt">(необязательно)</span></label>
        <input id="what" maxlength="120" autocomplete="off" placeholder="напр. Ноябрь, кампания «Ваке»">
      </div>
      <div class="field" data-f="comment">
        <label for="comment">Комментарий <span style="font-size:12px;opacity:.8">(необязательно)</span></label>
        <textarea id="comment" maxlength="800"></textarea>
      </div>
    </div>
  </div>
</main>

<button id="fallbackBtn" type="button">Сохранить расход</button>
<div id="toast"></div>

<script>
(function () {
  var REQUIRED = ['date', 'amount', 'category', 'sub'];

  // Разделы и подразделы. amount/cur — автоподстановка суммы (можно изменить).
  var SECTIONS = [
    { name: 'Зарплата', icon: '👥', subs: [
      { name: 'Лиза (Сбор и поиск)', amount: 750 },
      { name: 'Антон (Заполнение)', amount: 750 },
      { name: 'Лера (Ассистент)', amount: 500 },
      { name: 'Гио (Переговорщик)', amount: 500 },
      { name: 'Александр (Главный переговорщик)', amount: 300 },
      { name: 'Артем (Главный презентатор)', amount: 300 },
      { name: 'Вито (Генеральный директор)', amount: 750 }
    ]},
    { name: 'Офис', icon: '🏢', subs: [
      { name: 'Аренда офиса', amount: 900 },
      { name: 'Обслуживание ЖК', amount: 100, cur: '₾' },
      { name: 'Уборка офиса' }
    ]},
    { name: 'Коммунальные', icon: '💡', subs: [
      { name: 'Газ' }, { name: 'Свет' }, { name: 'Вода' }, { name: 'Интернет' }, { name: 'Уборка улицы' }
    ]},
    { name: 'Реклама', icon: '📣', subs: [
      { name: 'Meta' }, { name: 'Telegram Ads' }, { name: 'Каналы' }, { name: 'Блогеры' }
    ]},
    { name: 'Разработка', icon: '🛠', subs: [
      { name: 'Фронтенд' }, { name: 'Бэкенд' }, { name: 'Дизайн' }
    ]},
    { name: 'Инструменты (подписки)', icon: '🔧', subs: [
      { name: 'Hetzner (сервер)' }, { name: 'Dewatermark' }, { name: 'Другая подписка', other: true }
    ]},
    { name: 'Доп. услуги', icon: '🤝', subs: [
      { name: 'Юрист' }, { name: 'Бухгалтер' }, { name: 'Жанна' }
    ]},
    { name: 'Доп. расходы', icon: '📦', subs: [
      { name: 'Мебель в офис' }, { name: 'Техника (компьютеры и т.д.)' }, { name: 'Другое', other: true }
    ]}
  ];

  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== 'unknown');
  var state = { currency: '$', category: '', sub: '' };
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var now = new Date();
  $('date').value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

  function chip(label, value, on) {
    return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-v="' + value + '">' + label + '</button>';
  }
  function sectionBy(name) { return SECTIONS.filter(function (x) { return x.name === name; })[0]; }
  function subBy(sec, name) { return sec ? sec.subs.filter(function (x) { return x.name === name; })[0] : null; }
  function setCurrency(c) {
    state.currency = c;
    document.querySelectorAll('[data-group="currency"] .chip').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-v') === c);
    });
  }
  $('cats').innerHTML = SECTIONS.map(function (x) { return chip(x.icon + ' ' + x.name, x.name, false); }).join('');
  $('cats').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.chip'); if (!btn) return;
    $('cats').querySelectorAll('.chip').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    state.category = btn.getAttribute('data-v'); state.sub = '';
    clearErr('category');
    var sec = sectionBy(state.category);
    $('subLabel').textContent = state.category === 'Зарплата' ? 'Сотрудник' : 'Подраздел';
    $('subs').innerHTML = sec.subs.map(function (x) {
      return chip(x.name + (x.amount ? ' · ' + (x.cur === '₾' ? x.amount + ' ₾' : '$' + x.amount) : ''), x.name, false);
    }).join('');
    $('subField').style.display = 'block';
    updateWhat();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
  $('subs').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.chip'); if (!btn) return;
    $('subs').querySelectorAll('.chip').forEach(function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    state.sub = btn.getAttribute('data-v');
    clearErr('sub');
    var it = subBy(sectionBy(state.category), state.sub);
    if (it && it.amount) { $('amount').value = it.amount; setCurrency(it.cur || '$'); clearErr('amount'); }
    updateWhat();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  });
  function updateWhat() {
    var it = subBy(sectionBy(state.category), state.sub);
    var need = !!(it && (it.other || it.hint));
    $('whatOpt').style.display = need ? 'none' : '';
    $('what').placeholder = it && it.hint ? it.hint : (it && it.other ? 'Что именно' : 'напр. Ноябрь, кампания «Ваке»');
  }

  document.querySelectorAll('[data-group]').forEach(function (group) {
    group.addEventListener('click', function (ev) {
      var btn = ev.target.closest('.chip');
      if (!btn) return;
      var key = group.getAttribute('data-group');
      group.querySelectorAll('.chip').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      state[key] = btn.getAttribute('data-v');
      clearErr(key);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    });
  });

  function fieldEl(key) { return document.querySelector('[data-f="' + key + '"]'); }
  function clearErr(key) { var el = fieldEl(key); if (el) el.classList.remove('err'); }
  document.querySelectorAll('input, textarea').forEach(function (el) {
    el.addEventListener('input', function () { clearErr(el.id); });
  });
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function val(id) { return $(id).value.trim(); }

  function collect() {
    return {
      type: 'expense',
      v: 1,
      uid: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      date: $('date').value,
      amount: val('amount').replace(/\s+/g, '').replace(',', '.').replace(/[$₾]/g, ''),
      currency: state.currency,
      category: state.category,
      sub: state.sub,
      what: val('what'),
      comment: val('comment')
    };
  }

  function submit() {
    var d = collect();
    var bad = REQUIRED.filter(function (k) { return !d[k]; });
    var it = subBy(sectionBy(d.category), d.sub);
    if (it && (it.other || it.hint) && !d.what) bad.push('what');
    var amountBad = d.amount && (isNaN(Number(d.amount)) || Number(d.amount) <= 0);
    if (amountBad) bad.push('amount');
    bad.forEach(function (k) { var el = fieldEl(k); if (el) el.classList.add('err'); });
    if (bad.length) {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      toast(amountBad ? 'Сумма должна быть числом' : 'Заполните отмеченные поля');
      return;
    }
    var json = JSON.stringify(d);
    if (new TextEncoder().encode(json).length > 4000) { toast('Слишком много текста — сократите комментарий'); return; }
    if (!inTelegram) { console.log('Payload:', d); toast('Предпросмотр: откройте форму через кнопку в боте'); return; }
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    tg.sendData(json);
  }

  if (inTelegram) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.MainButton.setText('Сохранить расход');
    tg.MainButton.onClick(submit);
    tg.MainButton.show();
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
  } else {
    $('fallbackBtn').style.display = 'block';
    $('fallbackBtn').addEventListener('click', submit);
  }
})();
</script>
</body>
</html>
